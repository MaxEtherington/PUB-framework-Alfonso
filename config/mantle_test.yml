defaults:
  # N.B. Do not modify this section.
  # If any values are missing from the above sections,
  # the default values here will be used.
  run_name: default
  plate_model:
    use_provided_plate_model: true
    plate_model_name: alfonso2024_default
  timespan:
    min: 0
    max: 170

  use_extracted_data: true       # If true, use data extracted via notebooks, rather than pre-prepared data from Zenodo
  
  deposits_filename: "deposits.csv"
  regions_filename: "regions.geojson" # optional regions file, saved in data/
  
  reference_feature: trenches         # geometry used to define study area and unlabelled sampling
  study_zone_buffer: 6.0 # degrees    # radius around reference_feature for unlabelled point generation

  use_subduction_features: false
  use_crustal_features: false
  mantle:
    use_mantle_features: false           # if true, 01 reads training_data_global_with_mantle.csv
    mantle_data_dir: zahirovic2022           # Directory containing desired mantle outputs
  use_erodep: false

  n_jobs: 8
  verbose: true
  random_seed: 1234
  overwrite_output: false

  use_same_features: true
  automatic_feature_selection: false
  create_svm: true
  create_regional_models: true