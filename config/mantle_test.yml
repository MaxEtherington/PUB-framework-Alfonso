all_notebooks:
  # These parameters will be applied to all notebooks.
  # If one of these parameters also appears in the corresponding
  # notebook section, it can be specified there on a per-notebook basis.
  run_name: mantle_test                  # used as output directory name: outputs/{run_name}/
  plate_model:
    use_provided_plate_model: false
    plate_model_name: zahirovic2022
  timespan:
    min: 0
    max: 400

  use_extracted_data: true       # If true, use data extracted via notebooks, rather than pre-prepared data from Zenodo
  
  deposits_filename: "deposits-Etherington.csv"
  regions_filename: "regions.geojson" # optional regions file, saved in data/
  
  reference_feature: trenches         # geometry used to define study area and unlabelled sampling
  study_zone_buffer: 6.0 # degrees    # radius around reference_feature for unlabelled point generation

  feature_sets:
    subduction:                       # e.g. distance to trench, slab age
      enabled: false
    crustal:                          # e.g. crustal thickness
      enabled: false
    mantle:                           # e.g. temperature, flow velocity
      enabled: true
      data_dir: zahirovic2022
    erodep:                           # e.g. cumulative erosion/deposition (not strictly a "feature set", but included here for convenience)
      enabled: false

  n_jobs: 8
  verbose: true
  random_seed: 1234
  overwrite_output: false


