target-version = "py313"
line-length = 120

[lint]
select = ["E", "F", "W"]
ignore = [
  "E501",  # line too long — scientific code is verbose
  "E741",  # ambiguous variable names (l, O, I) — common in scientific/math code
]
exclude = [
  "nb_scripts/",
  "playground/",
  "submodules/",
  "__pycache__/",
]
